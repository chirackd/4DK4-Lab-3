name: Native experiments
on: [push, pull_request, workflow_dispatch]

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: mingw-w64-ucrt-x86_64-gcc
      - name: Expose native GCC to PowerShell
        shell: msys2 {0}
        run: cygpath -w /ucrt64/bin >> "$GITHUB_PATH"
      - name: Setup and run all parts directly in PowerShell
        shell: powershell
        run: |
          .\setup.ps1
          .\run_all.ps1 -Quick
          .\.venv\Scripts\python.exe -m unittest discover -s tests -v
      - uses: actions/upload-artifact@v4
        with:
          name: windows-native-smoke-results
          path: output/

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r lab/requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python lab/run_all.py --quick
